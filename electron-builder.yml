# Doros desktop (macOS, personal use: unsigned, no auto-update).
appId: com.doros.desktop
productName: Doros
directories:
  output: release
files:
  - electron-dist/**
  - electron/assets/**
  - package.json
  # The window loads the live site, so the web app's source, build and npm
  # dependencies (React, Supabase, …) aren't packaged. Runtime deps the main
  # process needs are listed back in explicitly.
  - "!src/**"
  - "!dist/**"
  - "!node_modules/**"
  # The tray draws the tomato countdown with resvg (native module, Apple Silicon only).
  - node_modules/@resvg/resvg-js/**
  - node_modules/@resvg/resvg-js-darwin-arm64/**
  # Site blocking: the root helper and its installer, so "Set Up Site Blocking…" works
  # without the repo, and the app can tell when the installed helper is outdated.
  - electron/helper/*.sh
# Native .node binaries can't be loaded from inside app.asar, and sh can't read it.
asarUnpack:
  - "**/*.node"
  - electron/helper/*.sh
# doros://auth-callback brings Google sign-in back from the system browser.
protocols:
  - name: Doros
    schemes:
      - doros
mac:
  target: dir
  identity: null
  category: public.app-category.productivity
