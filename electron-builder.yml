# Doros desktop (macOS, personal use: unsigned, no auto-update).
appId: com.doros.desktop
productName: Doros
directories:
  output: release
files:
  - electron-dist/**
  - electron/assets/**
  - package.json
  # The window loads the live site, so the web app's source, build and npm
  # dependencies (React, Supabase, …) aren't packaged. Runtime deps the main
  # process needs are listed back in explicitly.
  - "!src/**"
  - "!dist/**"
  - "!node_modules/**"
# doros://auth-callback brings Google sign-in back from the system browser.
protocols:
  - name: Doros
    schemes:
      - doros
mac:
  target: dir
  identity: null
  category: public.app-category.productivity
